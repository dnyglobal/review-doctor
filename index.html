<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리뷰닥터 (ReviewDoctor) - 외식업 사장님을 위한 AI 리뷰 처방전</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 800px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-top: 0; display: flex; align-items: center; gap: 8px; }
    .badge { background: #fee2e2; color: #dc2626; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
    label { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block; }
    textarea, input { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 16px; outline: none; transition: 0.2s; }
    textarea:focus, input:focus { border-color: #2563eb; }
    .btn-group { display: flex; gap: 12px; margin-bottom: 24px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; color: #ffffff; }
    .btn-danger:hover { background: #dc2626; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .result-box { background: #f1f5f9; border-radius: 10px; padding: 18px; margin-bottom: 16px; position: relative; border-left: 4px solid #2563eb; display: none; }
    .result-box.danger-box { border-left: 4px solid #ef4444; background: #fff5f5; }
    .result-title { font-weight: 700; font-size: 14px; color: #0f172a; margin-bottom: 10px; }
    .result-content { font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: #334155; }
    .copy-btn { position: absolute; top: 14px; right: 14px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .copy-btn:hover { background: #f8fafc; }
    .loading { display: none; text-align: center; font-weight: 700; color: #2563eb; margin: 20px 0; font-size: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🩺 리뷰닥터 (ReviewDoctor) <span class="badge">PRO</span></h1>
  <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">외식업 사장님을 위한 3초 악플 응급처치 및 게시중단(블라인드) 신청서 자동 처방 엔진</p>

  <label>매장 유형 및 대표 메뉴</label>
  <input type="text" id="storeInfo" placeholder="예: 숙성 삼겹살 전문점 (대표메뉴: 삼겹살, 김치찌개)" value="숙성 삼겹살 전문점 (대표메뉴: 삼겹살, 김치찌개)">

  <label>고객 리뷰 내용</label>
  <textarea id="reviewInput" rows="4" placeholder="배민/쿠팡이츠/요기요의 불만 리뷰나 억지 악플을 그대로 붙여넣으세요..."></textarea>

  <div class="btn-group">
    <button class="btn-primary" id="replyBtn" onclick="requestAI('reply')">AI 맞춤 사장님 답변 처방</button>
    <button class="btn-danger" id="complaintBtn" onclick="requestAI('complaint')">플랫폼 법적 게시중단 신청서 작성</button>
  </div>

  <div class="loading" id="loadingSpinner">⏳ AI 엔진이 분석 중입니다. 약 2~3초 소요됩니다...</div>

  <div class="result-box" id="resultContainer">
    <div class="result-title" id="resultHeader">처방 결과</div>
    <button class="copy-btn" onclick="copyResult()">원클릭 복사</button>
    <div class="result-content" id="resultText"></div>
  </div>
</div>

<script>
function copyResult() {
  const text = document.getElementById('resultText').innerText;
  navigator.clipboard.writeText(text);
  alert("클립보드에 복사되었습니다. 배민 사장님 사이트에 그대로 붙여넣으세요!");
}

async function requestAI(mode) {
  const store = document.getElementById('storeInfo').value.trim();
  const review = document.getElementById('reviewInput').value.trim();

  if (!review) {
    alert("리뷰 내용을 입력해 주세요.");
    return;
  }

  const loading = document.getElementById('loadingSpinner');
  const resultBox = document.getElementById('resultContainer');
  const resultText = document.getElementById('resultText');
  const resultHeader = document.getElementById('resultHeader');
  const replyBtn = document.getElementById('replyBtn');
  const complaintBtn = document.getElementById('complaintBtn');

  loading.style.display = 'block';
  resultBox.style.display = 'none';
  replyBtn.disabled = true;
  complaintBtn.disabled = true;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode, store, review })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.message || ("서버 응답 에러 (코드: " + res.status + ")"));
    }

    if (mode === 'reply') {
      resultBox.className = "result-box";
      resultHeader.innerText = "■ 리뷰닥터 처방: 사장님 공관 답변 (상황 맞춤형 2종)";
    } else {
      resultBox.className = "result-box danger-box";
      resultHeader.innerText = "■ 리뷰닥터 법적 조치: 배민/쿠팡이츠/네이버 제출용 [게시중단(블라인드) 요청서]";
    }

    resultText.innerText = data.result;
    resultBox.style.display = 'block';
  } catch (err) {
    alert("오류 안내:\n" + err.message);
  } finally {
    loading.style.display = 'none';
    replyBtn.disabled = false;
    complaintBtn.disabled = false;
  }
}
</script>

</body>
</html>
