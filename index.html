<script>
function copyResult() {
  const text = document.getElementById('resultText').innerText;
  navigator.clipboard.writeText(text);
  alert("클립보드에 복사되었습니다. 배민 사장님 사이트에 그대로 붙여넣으세요!");
}

async function requestAI(mode) {
  const store = document.getElementById('storeInfo').value.trim();
  const review = document.getElementById('reviewInput').value.trim();

  if (!review) {
    alert("리뷰 내용을 입력해 주세요.");
    return;
  }

  const loading = document.getElementById('loadingSpinner');
  const resultBox = document.getElementById('resultContainer');
  const resultText = document.getElementById('resultText');
  const resultHeader = document.getElementById('resultHeader');
  const replyBtn = document.getElementById('replyBtn');
  const complaintBtn = document.getElementById('complaintBtn');

  loading.style.display = 'block';
  resultBox.style.display = 'none';
  replyBtn.disabled = true;
  complaintBtn.disabled = true;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ mode, store, review })
    });

    const textData = await res.text();
    let data;
    try {
      data = JSON.parse(textData);
    } catch (e) {
      throw new Error("서버 응답 오류 (HTML): " + textData.slice(0, 100));
    }

    if (!res.ok) {
      throw new Error(data.message || "서버 통신 실패");
    }

    if (mode === 'reply') {
      resultBox.className = "result-box";
      resultHeader.innerText = "■ 리뷰닥터 처방: 사장님 공관 답변 (상황 맞춤형 2종)";
    } else {
      resultBox.className = "result-box danger-box";
      resultHeader.innerText = "■ 리뷰닥터 법적 조치: 배민/쿠팡이츠/네이버 제출용 [게시중단(블라인드) 요청서]";
    }

    resultText.innerText = data.result;
    resultBox.style.display = 'block';
  } catch (err) {
    alert("오류 발생: " + err.message);
  } finally {
    loading.style.display = 'none';
    replyBtn.disabled = false;
    complaintBtn.disabled = false;
  }
}
</script>
